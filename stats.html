<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Clash 225 · Chiffres</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#04251A"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--o:#F77F00;--ol:#FFB04D;--g:#009E60;--gl:#2FD08C;--y:#FFD43B;--night:#04251A;--muted:#CFE8DC;--d:'Lilita One',sans-serif;--b:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:var(--b);background:#04251A radial-gradient(ellipse 80% 40% at 50% -5%,#F77F0066,transparent 70%) no-repeat}html{background:#04251A}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:400 30px var(--d);color:var(--o);-webkit-text-stroke:2px #fff;paint-order:stroke fill}h1 span{color:var(--g)}
h2{margin:0 0 8px;font:400 19px var(--d);color:var(--ol)}
.card{padding:14px;border-radius:18px;background:#00000040;border:2px solid #ffffff22}
#excl{margin-top:4px;padding:12px 16px;border-radius:12px;border:0;background:#F77F00;color:#fff;font:700 15px var(--b);cursor:pointer}.kpi.big{border-color:#7CF0A8}.kpi.big b{color:#7CF0A8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{padding:12px;border-radius:14px;background:#ffffff0f;border:1.5px solid #ffffff22}.kpi b{display:block;font:400 30px var(--d);color:var(--y)}.kpi span{font:600 13px var(--b);color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;position:relative}
.bar i{display:block;border-radius:3px 3px 0 0}.bar .a{background:var(--gl)}.bar .n{background:var(--o)}
.bar small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:600 9px var(--b);color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;margin-top:24px;font:600 12px var(--b);color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
table{width:100%;border-collapse:collapse;font:600 13px var(--b)}th,td{padding:7px 4px;text-align:left;border-bottom:1px solid #ffffff1a}th{font:400 13px var(--d);color:var(--ol)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.login{display:flex;gap:8px}.login input{flex:1;font:700 16px var(--b);padding:12px;border-radius:12px;border:2px solid #ffffff44;background:#ffffff14;color:#fff;text-transform:uppercase}
button{font:400 17px var(--d);padding:12px 18px;border-radius:12px;border:2px solid #fff;color:#fff;background:linear-gradient(180deg,var(--ol),var(--o));cursor:pointer}
.err{color:#FF8A7A;font-weight:700;margin:0}.note{margin:0;font:600 12.5px/1.4 var(--b);color:var(--muted)}
</style></head><body><main>
<h1>LUDO <span>CLASH</span> 225 · Chiffres</h1>
<section class="card" id="loginBox"><h2>Accès propriétaire</h2><div class="login"><input id="code" placeholder="Code admin" autocomplete="off"><button id="go">Voir</button></div><p class="err" id="err"></p></section>
<div id="out" hidden></div>
</main>
<script>
const SB='https://fjtzyjjbftdrgmayvuqx.supabase.co/functions/v1/clash?forceFunctionRegion=eu-west-3',KEY='sb_publishable_XLEZldSG4D4FeJEk4tdg7w_2z7amj-s';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const myKey=()=>{try{const k=localStorage.getItem('ludo225-key')||'';return k.length>=20?k:'';}catch(e){return '';}};
const ART={didib:'Didi B',elown:'Elown',himra:'Himra',suspect95:'Suspect 95'};
async function load(code){const r=await fetch(SB,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action:'admin_stats',secret:code,...(myKey()?{key:myKey()}:{})})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');return j;}
function render(j){const days=[];for(let k=13;k>=0;k--){const d=new Date(Date.now()-k*86400000).toISOString().slice(0,10);days.push(d);}
  const v=(d,m)=>(j.rows.find(x=>x.day===d&&x.metric===m)||{value:0}).value,sum=m=>j.rows.reduce((a,x)=>a+(x.metric===m?x.value:0),0);
  const t=new Date().toISOString().slice(0,10),max=Math.max(1,...days.map(d=>v(d,'active')));
  const d1=j.d1.cohort?Math.round(j.d1.back/j.d1.cohort*100)+' %':'–';
  document.getElementById('out').innerHTML=`
  <section class="card"><h2>Aujourd'hui</h2><div class="kpis">
    <div class="kpi"><b>${v(t,'active')}</b><span>joueurs actifs</span></div><div class="kpi"><b>${v(t,'new_devices')}</b><span>nouveaux</span></div>
    <div class="kpi"><b>${v(t,'games')}</b><span>clashs joués</span></div><div class="kpi"><b>${v(t,'shares')}</b><span>partages</span></div></div></section>
  <section class="card"><h2>Depuis le début</h2><div class="kpis">
    <div class="kpi big"><b>${j.unique??0}</b><span>joueurs uniques</span></div><div class="kpi"><b>${j.accounts??0}</b><span>comptes (pseudo + code)</span></div>
    <div class="kpi"><b>${j.noAcc??0}</b><span>sans compte encore</span></div><div class="kpi"><b>${j.appDev??0}</b><span>sur l'appli Android</span></div>
    <div class="kpi"><b>${d1}</b><span>reviennent le lendemain (${j.d1.back}/${j.d1.cohort})</span></div><div class="kpi"><b>${sum('referrals')}</b><span>parrainages (30 j)</span></div></div></section>
  <section class="card"><h2>14 derniers jours</h2><div class="chart">${days.map(d=>{const a=v(d,'active'),n=v(d,'new_devices');
      return `<div class="bar" title="${d} : ${a} actifs, ${n} nouveaux"><i class="a" style="height:${(a-n)/max*130}px"></i><i class="n" style="height:${n/max*130}px"></i><small>${d.slice(8)}</small></div>`;}).join('')}</div>
    <div class="legend"><span><i style="background:var(--o)"></i>nouveaux</span><span><i style="background:var(--gl)"></i>qui reviennent</span></div></section>
  <section class="card"><h2>Modes joués (30 j)</h2><table><tr><th>Mode</th><th class="n">Clashs</th></tr>
    ${[['ia','Contre l\'IA'],['local','Entre artistes'],['online','En ligne'],['tour','Tournoi']].map(([k,l])=>`<tr><td>${l}</td><td class="n">${sum('games_'+k)}</td></tr>`).join('')}
    <tr><td>Installés via l'appli Android</td><td class="n">${sum('new_app')}</td></tr></table></section>
  <section class="card"><h2>Top 10 joueurs</h2><table><tr><th>#</th><th>Pseudo</th><th>Clan</th><th class="n">XP</th><th class="n">Clashs</th><th class="n">Filleuls</th></tr>
    ${(j.top||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.pseudo)}</td><td>${ART[p.fav]||''}</td><td class="n">${p.xp}</td><td class="n">${p.games}</td><td class="n">${p.refs}</td></tr>`).join('')||'<tr><td colspan="6">Personne pour l\'instant.</td></tr>'}</table></section>
  <section class="card"><h2>Boss de la semaine</h2><table>${(j.champs||[]).map(c=>`<tr><td>${c.week_key}</td><td>👑 ${esc(c.pseudo)}</td><td class="n">${c.xp} XP</td></tr>`).join('')||'<tr><td>Le premier sera couronné lundi.</td></tr>'}</table></section>
  <section class="card"><h2>Tes téléphones</h2><p class="note" style="text-align:left">${myKey()?(j.meExcluded?'✅ Ce navigateur n\'est <b>pas</b> compté dans les chiffres.':'Ce navigateur est compté comme un joueur. Touche le bouton pour l\'enlever des chiffres.'):'Ce navigateur n\'a jamais ouvert le jeu : rien à exclure ici.'}</p>
    ${myKey()?`<button id="excl">${j.meExcluded?'Le compter à nouveau':'Ne pas compter ce téléphone'}</button>`:''}
    <p class="note" style="text-align:left">Dans l'appli Android : Profil, tout en bas, touche 5 fois « Ludo Clash 225 · v66 » puis entre ton code admin.</p></section>
  <p class="note">Un joueur = un compte (pseudo + code secret), même s'il change de téléphone. Les joueurs sans compte sont comptés par téléphone. Tes téléphones exclus ne sont pas comptés.</p>`;
  const ex=document.getElementById('excl');if(ex)ex.onclick=async()=>{ex.disabled=true;try{const r=await fetch(SB,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action:'admin_exclude',secret:sessionStorage.getItem('adm'),key:myKey(),on:!j.meExcluded})});if(!r.ok)throw 0;go(sessionStorage.getItem('adm'));}catch(e){ex.disabled=false;ex.textContent='Erreur, réessaie';}};
  document.getElementById('out').hidden=false;document.getElementById('loginBox').hidden=true;}
async function go(code){const e=document.getElementById('err');e.textContent='Chargement…';
  try{const j=await load(code);try{sessionStorage.setItem('adm',code);}catch(_){}e.textContent='';render(j);}catch(x){e.textContent=x.message;}}
document.getElementById('go').onclick=()=>go(document.getElementById('code').value.trim());
document.getElementById('code').onkeydown=e=>{if(e.key==='Enter')go(e.target.value.trim());};
try{const c=sessionStorage.getItem('adm');if(c)go(c);}catch(e){}
</script></body></html>
